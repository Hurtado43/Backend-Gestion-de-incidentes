spring.application.name=incidentes-api
server.port=${PORT:8080}

# Conexion a MongoDB. Se puede sobrescribir con la variable de entorno MONGODB_URI
# (por ejemplo, una cadena de MongoDB Atlas: mongodb+srv://usuario:clave@cluster/incidentes_db)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/incidentes_db}
spring.data.mongodb.auto-index-creation=true

# Documentacion interactiva: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

spring.jackson.serialization.write-dates-as-timestamps=false

# Datos de demostracion: se cargan solo si la base esta vacia. Para desactivarlos: APP_DATOS_DEMO=false
app.datos-demo=${APP_DATOS_DEMO:true}
